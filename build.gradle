plugins {
	id 'net.fabricmc.fabric-loom-remap'
	id 'maven-publish'
	id 'org.jetbrains.kotlin.jvm'
}

import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.Path
import java.security.MessageDigest
import java.util.zip.ZipInputStream

version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url 'https://maven.wispforest.io' }
	maven { url 'https://jitpack.io' }
}

loom {
	splitEnvironmentSourceSets()
	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "mossy.refmap.json"
	}

	mods {
		"mossy" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Add Kotlin source directories
sourceSets {
	main {
		kotlin {
			srcDirs = ['src/main/kotlin', 'src/main/java']
		}
	}
	client {
		kotlin {
			srcDirs = ['src/client/kotlin', 'src/client/java']
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${sc.current.version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// Fabric Kotlin
	modImplementation "net.fabricmc:fabric-language-kotlin:1.13.0+kotlin.2.1.0"
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	include "io.wispforest:owo-lib:${project.owo_version}"
	
	// Kotlin standard library
	implementation "org.jetbrains.kotlin:kotlin-stdlib"
	
	// JNA for MOSS native library integration
	implementation 'net.java.dev.jna:jna:5.14.0'
	implementation 'net.java.dev.jna:jna-platform:5.14.0'
	include 'net.java.dev.jna:jna:5.14.0'
	include 'net.java.dev.jna:jna-platform:5.14.0'
	
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand inputs.properties
	}
}

def mossReleaseApi = 'https://api.github.com/repos/redstone-md/moss/releases/latest'
def mossNativeTargets = [
	'linux-x86_64'  : [asset: 'moss-linux-amd64-shared.zip', file: 'libmoss.so'],
	'macos-aarch64' : [asset: 'moss-macos-arm64-shared.zip', file: 'libmoss.dylib'],
	'macos-x86_64'  : [asset: 'moss-macos-amd64-shared.zip', file: 'libmoss.dylib'],
	'windows-x86_64': [asset: 'moss-windows-amd64-shared.zip', file: 'moss.dll']
]

def downloadMossNatives = tasks.register('downloadMossNatives') {
	group = 'build setup'
	description = 'Downloads and verifies latest MOSS native shared libraries from GitHub releases.'

	def outputDir = layout.buildDirectory.dir('generated/moss-natives')
	def cacheDir = layout.buildDirectory.dir('moss-native-cache')
	outputs.dir(outputDir)
	outputs.upToDateWhen { false }

	doLast {
		def localOverride = providers.gradleProperty('mossLocalNatives').orNull
		if (localOverride != null && !localOverride.isEmpty()) {
			def overrideRoot = file(localOverride).toPath()
			def nativeRoot = outputDir.get().asFile.toPath().resolve('natives')
			mossNativeTargets.each { platform, target ->
				def src = overrideRoot.resolve(platform).resolve(target.file)
				if (!Files.exists(src)) {
					logger.warn("Local override missing for ${platform}: ${src} (skipping)")
					return
				}
				def targetDir = nativeRoot.resolve(platform)
				def targetFile = targetDir.resolve(target.file)
				Files.createDirectories(targetDir)
				Files.copy(src, targetFile, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			}
			logger.lifecycle("Using local MOSS natives from ${overrideRoot}")
			return
		}
		def release = readJson(mossReleaseApi)
		def assets = release.assets.collectEntries { asset -> [(asset.name): asset] }
		def nativeRoot = outputDir.get().asFile.toPath().resolve('natives')
		def cacheRoot = cacheDir.get().asFile.toPath()

		mossNativeTargets.each { platform, target ->
			def asset = assets[target.asset]
			if (asset == null) {
				throw new GradleException("MOSS release ${release.tag_name} is missing asset ${target.asset}")
			}

			def expectedSha256 = asset.digest?.toString()?.startsWith('sha256:')
				? asset.digest.toString().substring('sha256:'.length())
				: null
			if (expectedSha256 == null) {
				throw new GradleException("MOSS release asset ${target.asset} has no sha256 digest")
			}

			def zipFile = cacheRoot.resolve("${asset.id}-${target.asset}")
			Files.createDirectories(cacheRoot)
			if (!Files.exists(zipFile) || sha256(zipFile) != expectedSha256) {
				downloadFile(asset.browser_download_url.toString(), zipFile)
			}

			def actualSha256 = sha256(zipFile)
			if (actualSha256 != expectedSha256) {
				throw new GradleException("Checksum mismatch for ${target.asset}: expected ${expectedSha256}, got ${actualSha256}")
			}

			def targetDir = nativeRoot.resolve(platform)
			def targetFile = targetDir.resolve(target.file)
			Files.createDirectories(targetDir)
			extractZipEntry(zipFile, target.file, targetFile)
		}

		logger.lifecycle("Downloaded MOSS natives from ${release.html_url}")
	}
}

sourceSets {
	main {
		resources.srcDir(downloadMossNatives.map { it.outputs.files.singleFile })
	}
}

static def readJson(String url) {
	def connection = new URL(url).openConnection()
	connection.setRequestProperty('Accept', 'application/vnd.github+json')
	connection.setRequestProperty('User-Agent', 'MossyMod Gradle build')
	connection.inputStream.withCloseable { input ->
		return new JsonSlurper().parse(input)
	}
}

static void downloadFile(String url, Path target) {
	def connection = new URL(url).openConnection()
	connection.setRequestProperty('User-Agent', 'MossyMod Gradle build')
	connection.inputStream.withCloseable { input ->
		Files.copy(input, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

static String sha256(Path file) {
	def digest = MessageDigest.getInstance('SHA-256')
	Files.newInputStream(file).withCloseable { input ->
		byte[] buffer = new byte[8192]
		for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
			digest.update(buffer, 0, read)
		}
	}
	return digest.digest().collect { String.format('%02x', it) }.join()
}

static void extractZipEntry(Path zipFile, String expectedFileName, Path targetFile) {
	boolean extracted = false
	Files.newInputStream(zipFile).withCloseable { fileInput ->
		new ZipInputStream(fileInput).withCloseable { zipInput ->
			for (def entry = zipInput.nextEntry; entry != null; entry = zipInput.nextEntry) {
				if (!entry.directory && Path.of(entry.name).fileName.toString() == expectedFileName) {
					Files.copy(zipInput, targetFile, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
					extracted = true
					break
				}
			}
		}
	}
	if (extracted) {
		return
	}
	throw new GradleException("${zipFile.fileName} does not contain ${expectedFileName}")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	jvmToolchain(21)
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
